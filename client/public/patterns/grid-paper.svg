<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40">
      <!-- Major grid lines -->
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e6e1" stroke-width="0.5" opacity="0.5"/>
      <!-- Minor grid lines -->
      <path d="M 10 0 L 10 40" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
      <path d="M 20 0 L 20 40" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
      <path d="M 30 0 L 30 40" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
      <path d="M 0 10 L 40 10" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
      <path d="M 0 20 L 40 20" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
      <path d="M 0 30 L 40 30" fill="none" stroke="#e8e6e1" stroke-width="0.25" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
</svg>
