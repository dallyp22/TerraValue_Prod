<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="contour" patternUnits="userSpaceOnUse" width="200" height="200">
      <!-- Topographic contour lines - subtle organic curves -->
      <path d="M0,40 Q50,30 100,45 T200,35" fill="none" stroke="#d3d0c9" stroke-width="0.5" opacity="0.4"/>
      <path d="M0,80 Q60,70 120,85 T200,75" fill="none" stroke="#d3d0c9" stroke-width="0.5" opacity="0.35"/>
      <path d="M0,120 Q40,110 100,125 T200,115" fill="none" stroke="#d3d0c9" stroke-width="0.5" opacity="0.3"/>
      <path d="M0,160 Q70,150 130,165 T200,155" fill="none" stroke="#d3d0c9" stroke-width="0.5" opacity="0.25"/>

      <!-- Secondary offset contours for depth -->
      <path d="M-20,60 Q30,50 90,65 T180,55" fill="none" stroke="#e8e6e1" stroke-width="0.3" opacity="0.3"/>
      <path d="M-10,100 Q50,90 110,105 T190,95" fill="none" stroke="#e8e6e1" stroke-width="0.3" opacity="0.25"/>
      <path d="M10,140 Q60,130 120,145 T210,135" fill="none" stroke="#e8e6e1" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#contour)"/>
</svg>
