<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>FarmScope AI - Iowa Land Intelligence</title>
    <meta name="description" content="Professional agricultural land valuations for Iowa. AI-powered property assessments with CSR2 soil analysis and market insights.">

    <!-- FarmScope AI Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">

    <!-- Preconnect to critical origins - establishes early connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin>

    <link rel="preconnect" href="https://web-production-51e54.up.railway.app" crossorigin>

    <!-- Non-blocking Google Fonts load using media swap technique -->

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"></noscript>

    <!-- Critical CSS inline for faster FCP -->
    <style>
      /* Minimal critical CSS for initial render */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;background:#faf6ed}
      #root{min-height:100vh}
    </style>
  </head>
